# Builds the CP-SAT runner (native/cpsat-runner) for every platform the desktop app ships on,
# checks each build solves the smoke model, and on a `cpsat-runner-v*` tag publishes the three
# bundles plus SHA256SUMS as a GitHub release. apps/desktop/scripts/fetch-cpsat.mjs downloads
# from that release, pinned by tag and hash — the app never builds C++ itself.
name: cpsat-runner

on:
  push:
    branches: ['**']
    tags: ['cpsat-runner-v*']
    paths:
      - 'native/cpsat-runner/**'
      - '.github/workflows/cpsat-runner.yml'
  workflow_dispatch:

env:
  ORTOOLS_TAG: v9.15
  ORTOOLS_BUILD: '9.15.6755'

permissions:
  contents: read

concurrency:
  group: cpsat-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # The archive names and hashes below move together with ORTOOLS_TAG/ORTOOLS_BUILD above and
    # CMakeLists.txt; the hashes are GitHub's asset digests for google/or-tools' release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
            archive: or-tools_arm64_macOS-26.2_cpp_v9.15.6755.tar.gz
            sha256: de0400a45939a66ee13cd8360c230e830fc5e03a6ed5a8a8b60f58a39e4a67bc
          - target: darwin-x64
            os: macos-15-intel
            archive: or-tools_x86_64_macOS-26.2_cpp_v9.15.6755.tar.gz
            sha256: d2d36482727520ccaff979eba16f53e6b2cabf40b6fd1126e4d3b34fad2fe851
          - target: win32-x64
            os: windows-2022
            archive: or-tools_x64_VisualStudio2022_cpp_v9.15.6755.zip
            sha256: 43429c741641c8b495ee77e44ea00f0f4524519495fd2edaf929003aa2b2ea30
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # dumpbin, which CMake's runtime-dependency scan needs on Windows, is only on PATH inside a
      # Visual Studio developer environment.
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # The archive is several hundred MB and never changes for a given build: cache it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ortools-archive
          key: ortools-${{ matrix.archive }}-${{ matrix.sha256 }}

      - name: Fetch OR-Tools ${{ env.ORTOOLS_BUILD }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ortools-archive" "$RUNNER_TEMP/ortools"
          cd "$RUNNER_TEMP/ortools-archive"
          if [ ! -f '${{ matrix.archive }}' ]; then
            gh release download "$ORTOOLS_TAG" -R google/or-tools -p '${{ matrix.archive }}'
          fi
          # Everything in the shipped runner is linked from this archive: verify it, cached or not.
          if command -v sha256sum > /dev/null; then sum='sha256sum'; else sum='shasum -a 256'; fi
          echo '${{ matrix.sha256 }}  ${{ matrix.archive }}' | $sum -c -
          cd "$RUNNER_TEMP/ortools"
          case '${{ matrix.archive }}' in
            *.zip) 7z x -y '../ortools-archive/${{ matrix.archive }}' > /dev/null ;;
            *) tar xzf '../ortools-archive/${{ matrix.archive }}' ;;
          esac
          root="$(ls -d "$RUNNER_TEMP"/ortools/or-tools_*/ | head -1)"
          if command -v cygpath > /dev/null; then root="$(cygpath -m "$root")"; fi
          echo "ORTOOLS_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S native/cpsat-runner -B build -DORTOOLS_ROOT="$ORTOOLS_ROOT" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          cmake --install build --config Release --prefix dist

      - name: Smoke test
        run: |
          exe=dist/cpsat-runner
          if [ '${{ runner.os }}' = 'Windows' ]; then exe=dist/cpsat-runner.exe; fi
          native/cpsat-runner/test/check.sh "$exe"

      - name: Package
        run: |
          tar -czf 'cpsat-runner-${{ matrix.target }}.tar.gz' -C dist .
          ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpsat-runner-${{ matrix.target }}
          path: cpsat-runner-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/cpsat-runner-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bundles
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bundles
          sha256sum cpsat-runner-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create '${{ github.ref_name }}' -R '${{ github.repository }}' \
            --title '${{ github.ref_name }}' \
            --notes "CP-SAT runner for ShiftNurse, built against OR-Tools $ORTOOLS_BUILD." \
            cpsat-runner-*.tar.gz SHA256SUMS
