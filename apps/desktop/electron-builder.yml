# Packaging (M14): `npm run dist` produces runnable mac (dmg, x64 + arm64) and Windows (nsis,
# x64) installers, and the migrations travel with them. Unsigned, and with no auto-update —
# both are the proposed M17 in ROADMAP.md.
#
# `npm run dist` from the repo root builds mac. Cross-building Windows from macOS needs the
# workspace form so extra flags reach electron-builder: `npm run dist -w @shiftnurse/desktop
# -- --win --x64` (root `npm run dist -- --win --x64` also forwards correctly through npm's
# `--` passthrough).
appId: com.shiftnurse.desktop
productName: ShiftNurse
# The Windows installer names its folder after package.json's `name` (`@shiftnurse/desktop`
# became `AppData\Local\Programs\@shiftnursedesktop`). Override it in the packaged metadata;
# the app's name and data folder come from productName and are unchanged.
extraMetadata:
  name: shiftnurse
directories:
  output: release
  buildResources: build
# `dependencies` in package.json is the packaged runtime set: everything electron-vite already
# bundled into out/ at build time (@shiftnurse/core, @shiftnurse/db, react, radix, tanstack) is
# a devDependency instead, so it never rides along a second time inside the asar.
files:
  - out/**
  - package.json
  - '!**/*.map'
  # better-sqlite3 ships its SQLite sources and Node-API prebuilds for every platform; the app
  # needs only lib/ and the target OS's prebuilds (see each platform's files below).
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/better-sqlite3/prebuilds/linux*'
  # Headers better-sqlite3 compiles against when no prebuild fits; never loaded at runtime.
  - '!node_modules/node-addon-api/**'
extraResources:
  # `openDatabase` needs the SQL migrations at runtime; main resolves them from
  # process.resourcesPath/drizzle in a packaged build (see src/main/database.ts).
  - from: ../../packages/db/drizzle
    to: drizzle
  # The CP-SAT runner and its OR-Tools libraries for this target, fetched by before-pack.mjs
  # (scripts/fetch-cpsat.mjs); main resolves it from process.resourcesPath/cpsat.
  - from: .cpsat/target
    to: cpsat
asarUnpack:
  - '**/*.node'
# Nothing to rebuild: better-sqlite3's prebuilds are Node-API, valid for Electron as shipped.
# A rebuild would only recompile it from source on the build machine for its own platform.
npmRebuild: false
beforePack: scripts/before-pack.mjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.business
  files:
    - '!node_modules/better-sqlite3/prebuilds/win32-*'
  target:
    - target: dmg
      arch: [x64, arm64]
win:
  files:
    - '!node_modules/better-sqlite3/prebuilds/darwin-*'
  target:
    - target: nsis
      arch: [x64]
