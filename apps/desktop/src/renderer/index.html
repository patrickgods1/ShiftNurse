<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Electron loads this page from disk in production, so a strict CSP is cheap insurance:
      the renderer never fetches remote scripts or styles, and this keeps it that way even
      if a future dependency tries to.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiftNurse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
